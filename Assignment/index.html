<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi IoT Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ff8578;
            background: linear-gradient(90deg, rgba(255, 133, 120, 1) 0%, rgba(255, 199, 143, 1) 16%, rgba(255, 243, 133, 1) 31%, rgba(173, 255, 153, 1) 49%, rgba(191, 255, 252, 1) 67%, rgba(179, 199, 255, 1) 83%, rgba(231, 179, 255, 1) 100%);;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { text-align: center; color: #333; }
        .dashboard-cards { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); flex: 1; text-align: center; min-width: 150px; }
        .card h3 { margin: 0; color: #666; font-size: 16px; }
        .card .value { font-size: 32px; font-weight: bold; color: #2c3e50; margin-top: 10px; }
        .control-panel { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; }
        .toggle-btn { padding: 10px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 25px; color: white; transition: 0.3s; }
        .toggle-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-on { background-color: #27ae60; }
        .btn-off { background-color: #e74c3c; }
        .chart-container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #status-text { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Raspberry Pi Live Dashboard ras67070102</h2>
    <div id="status-text">Connecting to REST API...</div>

    <div class="dashboard-cards">
        <div class="card"><h3>Temperature</h3><div class="value" id="temp-val">-- °C</div></div>
        <div class="card"><h3>Humidity</h3><div class="value" id="hum-val">-- %</div></div>
        <div class="card"><h3>Distance</h3><div class="value" id="dist-val">-- cm</div></div>
        <div class="card"><h3>LED Brightness</h3><div class="value" id="brightness-val">-- %</div></div>
    </div>

    <div class="control-panel">
        <h3>LED Control (REST API)</h3>
        <button id="led-btn" class="toggle-btn btn-off" onclick="toggleLED()">LED OFF</button>
        <p id="led-status-text">LED status: waiting for device...</p>
        <p id="brightness-status-text">Brightness: waiting for LoRa potentiometer...</p>
    </div>

    <div class="chart-container"><canvas id="liveChart"></canvas></div>
</div>

<script>
    // The page and REST API are served from the same host and port.
    // No browser-side MQTT connection is used.
    const API_TELEMETRY_ENDPOINT = "/api/telemetry";
    const API_LED_ENDPOINT = "/api/led";
    const POLL_INTERVAL_MS = 250;

    let isLedOn = false;
    let ledRequestPending = false;
    let lastChartTimestamp = null;

    const statusText = document.getElementById("status-text");
    const ledButton = document.getElementById("led-btn");
    const ledStatusText = document.getElementById("led-status-text");
    const brightnessStatusText = document.getElementById("brightness-status-text");

    function updateLEDButton(status) {
        isLedOn = status === "on" || status === true;
        ledButton.className = "toggle-btn " + (isLedOn ? "btn-on" : "btn-off");
        ledButton.innerText = isLedOn ? "LED ON" : "LED OFF";
    }

    function updateChart(tempValue, timestamp) {
        if (timestamp && timestamp === lastChartTimestamp) return;
        lastChartTimestamp = timestamp || new Date().toISOString();

        const timeNow = new Date().toLocaleTimeString("th-TH", {
            hour: "2-digit", minute: "2-digit", second: "2-digit"
        });
        if (liveChart.data.labels.length >= 15) {
            liveChart.data.labels.shift();
            liveChart.data.datasets[0].data.shift();
        }
        liveChart.data.labels.push(timeNow);
        liveChart.data.datasets[0].data.push(tempValue);
        liveChart.update();
    }

    async function refreshTelemetry() {
        try {
            const response = await fetch(API_TELEMETRY_ENDPOINT, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            if (data.temperature_c !== null && data.temperature_c !== undefined && Number.isFinite(Number(data.temperature_c))) {
                const value = Number(data.temperature_c);
                document.getElementById("temp-val").innerText = value.toFixed(2) + " °C";
                updateChart(value, data.temperature_timestamp || data.timestamp);
            }
            if (data.humidity_pct !== null && data.humidity_pct !== undefined && Number.isFinite(Number(data.humidity_pct))) {
                document.getElementById("hum-val").innerText = Number(data.humidity_pct).toFixed(2) + " %";
            }
            if (data.distance_cm !== null && data.distance_cm !== undefined && Number.isFinite(Number(data.distance_cm))) {
                document.getElementById("dist-val").innerText = Number(data.distance_cm).toFixed(1) + " cm";
            }

            if (data.brightness_percent !== null && data.brightness_percent !== undefined && Number.isFinite(Number(data.brightness_percent))) {
                const brightness = Math.max(0, Math.min(100, Number(data.brightness_percent)));
                document.getElementById("brightness-val").innerText = Math.round(brightness) + " %";
                if (data.lora_received_at) {
                    brightnessStatusText.innerText = `Brightness from LoRa potentiometer: ${Math.round(brightness)}%`;
                } else {
                    brightnessStatusText.innerText = `No LoRa potentiometer uplink yet — using default brightness: ${Math.round(brightness)}%`;
                }
            }
            if (data.led === "on" || data.led === "off") {
                updateLEDButton(data.led);
                ledStatusText.innerText = "LED control: " + data.led.toUpperCase();
            }

            const localMqtt = data.local_mqtt_connected ? "MQTT connected" : "MQTT disconnected";
            const loraMqtt = data.chirpstack_connected ? "LoRa connected" : "LoRa disconnected";
            statusText.innerText = `REST API connected — ${localMqtt} — ${loraMqtt}`;
            statusText.style.color = data.local_mqtt_connected ? "green" : "#c27c0e";
        } catch (error) {
            statusText.innerText = "REST API connection failed: " + (error.message || "Unknown error");
            statusText.style.color = "red";
        }
    }

    async function toggleLED() {
        if (ledRequestPending) return;

        const targetState = isLedOn ? "off" : "on";
        ledRequestPending = true;
        ledButton.disabled = true;
        ledButton.innerText = "Sending...";
        ledStatusText.innerText = "Sending REST API request to turn LED " + targetState.toUpperCase() + "...";

        try {
            const response = await fetch(API_LED_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "led", state: targetState })
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) {
                throw new Error(result.message || `HTTP ${response.status}`);
            }
            updateLEDButton(result.state || targetState);
            ledStatusText.innerText = "LED confirmed: " + (result.state || targetState).toUpperCase();
        } catch (error) {
            const message = error.message || "REST API request error";
            if (message.includes("HTTP 504")) {
                // A timeout means the browser did not receive the acknowledgement in time;
                // the physical command may still have been applied. Do not label it as a definite failure.
                ledStatusText.innerText = "ยังไม่ได้รับ ACK จาก REST API — กำลังตรวจสถานะ LED จริง...";
                await new Promise(resolve => setTimeout(resolve, 900));
                await refreshTelemetry();
            } else {
                ledStatusText.innerText = "ส่งคำสั่งไม่สำเร็จ: " + message;
                alert("ส่งคำสั่ง LED ไม่สำเร็จ\n" + message);
            }
        } finally {
            ledRequestPending = false;
            ledButton.disabled = false;
            await refreshTelemetry();
        }
    }

    const ctx = document.getElementById("liveChart").getContext("2d");
    const liveChart = new Chart(ctx, {
        type: "line",
        data: {
            labels: [],
            datasets: [{
                label: "Temperature (°C)",
                data: [],
                borderColor: "#e74c3c",
                backgroundColor: "rgba(231, 76, 60, 0.2)",
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: {
                x: { display: true },
                y: { suggestedMin: 15, suggestedMax: 40 }
            }
        }
    });

    window.addEventListener("load", () => {
        refreshTelemetry();
        setInterval(refreshTelemetry, POLL_INTERVAL_MS);
    });
</script>
</body>
</html>
